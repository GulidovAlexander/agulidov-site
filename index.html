<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Александр Гулидов</title>
  <meta name="description" content="Александр Гулидов. Alexander Gulidov.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #fafaf9;
        --muted: #a8a29e;
        --accent: #93c5fd;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 560px; margin: 0 auto; }
    h1 { margin: 0; font-size: 36px; line-height: 1.2; }
    .en-name { margin: 4px 0 24px; color: var(--muted); }
    p { margin: 0 0 4px; }
    .links { margin-top: 24px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Александр Гулидов</h1>
    <p class="en-name" lang="en">Alexander Gulidov</p>
    <p>Страница в разработке.</p>
    <p lang="en">This page is under construction.</p>
    <p class="links"><a href="https://github.com/GulidovAlexander">GitHub</a></p>
